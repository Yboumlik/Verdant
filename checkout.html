<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Verdant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Premium Checkout Styles */
        body {
            background-color: #fff;
            overflow-x: hidden;
        }

        .checkout-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Left Side - Form */
        .checkout-main {
            flex: 1.4;
            padding: 4rem 6%;
            background-color: #fff;
        }

        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }

        .checkout-logo {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
        }

        .steps {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        .step {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step.active {
            color: var(--color-primary);
            font-weight: 600;
        }

        .step-separator {
            color: #ddd;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .form-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-light);
        }

        .form-group input {
            width: 100%;
            padding: 1rem 0;
            border: none;
            border-bottom: 1px solid #ddd;
            font-family: var(--font-main);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
            background: transparent;
            border-radius: 0;
        }

        .form-group input:focus {
            border-bottom-color: var(--color-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* Right Side - Summary */
        .checkout-sidebar {
            flex: 1;
            background-color: var(--color-primary);
            color: #fff;
            padding: 4rem 6%;
            position: relative;
        }

        .sidebar-content {
            position: sticky;
            top: 4rem;
            max-width: 500px;
        }

        .sidebar-title {
            color: var(--color-secondary);
            font-size: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .summary-item {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-img {
            width: 100px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .summary-details h4 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .summary-details p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 0;
        }

        .summary-total {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .total-row.final {
            color: #fff;
            font-size: 1.8rem;
            font-family: var(--font-heading);
            margin-top: 1.5rem;
            align-items: baseline;
        }

        .btn-submit {
            background-color: var(--color-primary);
            color: #fff;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
            float: right;
            box-shadow: 0 10px 20px rgba(45, 74, 62, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--color-secondary);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-light);
            font-size: 0.9rem;
            margin-top: 2.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        @media (max-width: 968px) {
            .checkout-wrapper {
                flex-direction: column;
            }

            .checkout-sidebar {
                order: -1;
                padding: 2rem 6%;
            }

            .sidebar-content {
                position: static;
            }

            .checkout-main {
                padding: 2rem 6%;
            }
        }
    </style>
</head>

<body>
    <div class="checkout-wrapper">
        <!-- Main Content (Form) -->
        <main class="checkout-main">
            <header class="checkout-header">
                <a href="index.html" class="checkout-logo">Verdant.</a>
                <div class="steps">
                    <span class="step active">Shipping</span>
                    <span class="step-separator">/</span>
                    <span class="step">Payment</span>
                </div>
            </header>

            <section class="form-section">
                <h2>Shipping Details</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" required placeholder="Jane">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" required placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" required placeholder="jane@example.com">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" required placeholder="123 Nature Lane">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" required placeholder="New York">
                        </div>
                        <div class="form-group">
                            <label>Postal Code</label>
                            <input type="text" required placeholder="10001">
                        </div>
                    </div>

                    <h2 style="margin-top: 4rem;">Payment</h2>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="0000 0000 0000 0000">
                        <i class="ph ph-credit-card"
                            style="position: absolute; right: 0; top: 2.5rem; font-size: 1.5rem; color: #ccc;"></i>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry</label>
                            <input type="text" placeholder="MM/YY">
                        </div>
                        <div class="form-group">
                            <label>CVC</label>
                            <input type="text" placeholder="123">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <a href="index.html" class="back-link"><i class="ph ph-arrow-left"></i> Return to Shop</a>
                        <button type="submit" class="btn-submit">Pay Now</button>
                    </div>
                </form>
            </section>
        </main>

        <!-- Sidebar (Summary) -->
        <aside class="checkout-sidebar">
            <div class="sidebar-content">
                <h3 class="sidebar-title">Order Summary</h3>

                <div class="summary-item">
                    <img src="assets/products-20/bloomscape_monstera_alt_slate-768x937.jpg" alt="Monstera"
                        class="summary-img">
                    <div class="summary-details">
                        <h4>Monstera Deliciosa</h4>
                        <p>Size: Large</p>
                        <p>Qty: 1</p>
                        <p style="color: #fff; margin-top: 0.5rem;">$45.00</p>
                    </div>
                </div>

                <div class="summary-total">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span>$45.00</span>
                    </div>
                    <div class="total-row">
                        <span>Shipping</span>
                        <span>Calculated at next step</span>
                    </div>
                    <div class="total-row final">
                        <span>Total</span>
                        <span>$45.00</span>
                    </div>
                </div>

                <div
                    style="margin-top: 2rem; display: flex; gap: 1rem; color: rgba(255,255,255,0.6); font-size: 0.8rem;">
                    <span><i class="ph ph-lock-key"></i> Secure Checkout</span>
                    <span><i class="ph ph-arrow-counter-clockwise"></i> 30-Day Returns</span>
                </div>
            </div>
        </aside>
    </div>
</body>

</html>
